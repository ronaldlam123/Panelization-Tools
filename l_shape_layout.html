<!DOCTYPE html>
<html>
<head>
    <title>L-Shape Panelization Layout</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        h1 { margin-bottom: 5px; text-align: center; }
        p.subtitle { color: #86868b; margin-bottom: 30px; text-align: center; }
        .panel-wrapper { 
            background: #fff; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 14px rgba(0,0,0,0.05); 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .panel-stats { 
            font-size: 15px; 
            color: #333; 
            margin-bottom: 20px; 
            text-align: center; 
            line-height: 1.6; 
        }
        svg { 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            border-radius: 4px; 
        }
        .highlight { color: #00b894; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Interlocking "L" Layout</h1>
    <p class="subtitle">200x280mm Panel | 10mm Border | 3mm Routing Gap<br>Bounding Box: 105.8 x 76.91 mm (Rotated)</p>

    <div class="panel-wrapper">
        <div class="panel-stats">
            <strong>4 Bounding Blocks</strong> (2 cols &times; 2 rows)<br>
            <span class="highlight">Total Boards: 8 (Two L's per block)</span><br>
            Bounding Box Area Yield: 58.1%<br>
            <span style="font-size: 13px; color: #888;">(Each L-board is approx 4,068 mm², roughly twice the size of the 22x93 boards)</span>
        </div>
        
        <svg width="400" height="560" viewBox="0 0 200 280">
            <!-- Panel Base (FR4) -->
            <rect x="0" y="0" width="200" height="280" fill="#2d3436" />
            
            <!-- 10mm Border / Usable Area (180x260) -->
            <rect x="10" y="10" width="180" height="260" fill="none" stroke="#ff9f43" stroke-width="1.5" stroke-dasharray="4,4" />
            <text x="100" y="25" fill="#ff9f43" font-size="6" text-anchor="middle" font-family="sans-serif">10mm Border</text>
            
            <!-- 
                Draw Blocks: 2 cols, 2 rows. Rotated orientation (76.91 width, 105.8 height).
                Used W = 2*76.91 + 1*3 = 153.82 + 3 = 156.82. Offset X = 10 + (180-156.82)/2 = 21.59
                Used H = 2*105.8 + 1*3 = 211.6 + 3 = 214.6. Offset Y = 10 + (260-214.6)/2 = 32.7
            -->
            <g id="l-shape-modules">
                <script>
                    const svgContainer = document.getElementById('l-shape-modules');
                    const startX = 21.59;
                    const startY = 32.7;
                    const w = 76.91;
                    const h = 105.8;
                    const gap = 3;
                    
                    for(let r=0; r<2; r++) {
                        for(let c=0; c<2; c++) {
                            const x = startX + c * (w + gap);
                            const y = startY + r * (h + gap);
                            
                            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
                            group.setAttribute("transform", `translate(${x}, ${y})`);
                            
                            // L-Shape 1 (Top/Left)
                            const path1 = document.createElementNS("http://www.w3.org/2000/svg", "path");
                            path1.setAttribute("d", `M 0,0 L ${w},0 L ${w},${h/2} L ${w/2},${h/2} L ${w/2},${h} L 0,${h} Z`);
                            path1.setAttribute("fill", "#00b894");
                            path1.setAttribute("stroke", "#1d1d1f");
                            path1.setAttribute("stroke-width", "0.5");
                            
                            // L-Shape 2 (Bottom/Right)
                            const path2 = document.createElementNS("http://www.w3.org/2000/svg", "path");
                            path2.setAttribute("d", `M ${w},${h} L 0,${h} L 0,${h/2} L ${w/2},${h/2} L ${w/2},0 L ${w},0 Z`);
                            path2.setAttribute("fill", "#0984e3");
                            path2.setAttribute("stroke", "#1d1d1f");
                            path2.setAttribute("stroke-width", "0.5");
                            
                            group.appendChild(path1);
                            group.appendChild(path2);
                            svgContainer.appendChild(group);
                        }
                    }
                </script>
            </g>
        </svg>
    </div>

</body>
</html>
