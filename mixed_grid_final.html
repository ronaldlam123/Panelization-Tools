<!DOCTYPE html>
<html>
<head>
    <title>Optimized Mixed Grid Layout</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        h1 { margin-bottom: 5px; text-align: center; }
        p.subtitle { color: #86868b; margin-bottom: 30px; text-align: center; }
        .panel-wrapper { 
            background: #fff; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 14px rgba(0,0,0,0.05); 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .panel-stats { 
            font-size: 15px; 
            color: #333; 
            margin-bottom: 20px; 
            text-align: center; 
            line-height: 1.6; 
        }
        svg { 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            border-radius: 4px; 
        }
        .highlight { color: #00b894; font-weight: bold; }
    </style>
</head>
<body>

    <h1>The 10-Board "Mixed Grid"</h1>
    <p class="subtitle">200x280mm Panel | 10mm Border | 3mm Routing Gap<br>New Dimensions: 71.19 x 105.8 mm</p>

    <div class="panel-wrapper">
        <div class="panel-stats">
            <strong>5 Bounding Blocks</strong> (1 Standard Col + 1 Rotated Col)<br>
            <span class="highlight">Total Boards: 10</span><br>
            Bounding Box Area Yield: 67.3%
        </div>
        
        <svg width="400" height="560" viewBox="0 0 200 280">
            <!-- Panel Base (FR4) -->
            <rect x="0" y="0" width="200" height="280" fill="#2d3436" />
            
            <!-- Usable Area -->
            <rect x="10" y="10" width="180" height="260" fill="none" stroke="#ff9f43" stroke-width="1.5" stroke-dasharray="4,4" />
            <text x="100" y="25" fill="#ff9f43" font-size="6" text-anchor="middle" font-family="sans-serif">180mm Usable Width</text>
            
            <!-- 
                Col 1: Standard (71.19 x 105.8). Fits 2 rows.
                Col 2: Rotated (105.8 x 71.19). Fits 3 rows.
                Total width = 71.19 + 105.8 + 3 = 179.99 mm (Perfect fit!)
            -->
            <g id="mixed-modules-final">
                <script>
                    const svgContainer = document.getElementById('mixed-modules-final');
                    const gap = 3;
                    const w1 = 71.19; 
                    const h1 = 105.8; 
                    const w2 = 105.8; 
                    const h2 = 71.19; 
                    
                    // Col 1 (Standard) - centered vertically in the 260 height
                    const col1_used_h = (2 * h1) + gap;
                    const col1_offset_y = 10 + (260 - col1_used_h)/2;

                    for(let r=0; r<2; r++) {
                        const x = 10;
                        const y = col1_offset_y + r * (h1 + gap);
                        
                        const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
                        group.setAttribute("transform", `translate(${x}, ${y})`);
                        
                        // L-Shape 1
                        const path1 = document.createElementNS("http://www.w3.org/2000/svg", "path");
                        path1.setAttribute("d", `M 0,0 L ${w1},0 L ${w1},${h1/2} L ${w1/2},${h1/2} L ${w1/2},${h1} L 0,${h1} Z`);
                        path1.setAttribute("fill", "#0984e3");
                        path1.setAttribute("stroke", "#1d1d1f");
                        path1.setAttribute("stroke-width", "0.5");
                        
                        // L-Shape 2
                        const path2 = document.createElementNS("http://www.w3.org/2000/svg", "path");
                        path2.setAttribute("d", `M ${w1},${h1} L 0,${h1} L 0,${h1/2} L ${w1/2},${h1/2} L ${w1/2},0 L ${w1},0 Z`);
                        path2.setAttribute("fill", "#74b9ff");
                        path2.setAttribute("stroke", "#1d1d1f");
                        path2.setAttribute("stroke-width", "0.5");
                        
                        group.appendChild(path1);
                        group.appendChild(path2);
                        svgContainer.appendChild(group);
                    }

                    // Col 2 (Rotated) - centered vertically in the 260 height
                    const col2_used_h = (3 * h2) + (2 * gap);
                    const col2_offset_y = 10 + (260 - col2_used_h)/2;

                    for(let r=0; r<3; r++) {
                        const x = 10 + w1 + gap;
                        const y = col2_offset_y + r * (h2 + gap);
                        
                        const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
                        // We rotate around the center of the block
                        group.setAttribute("transform", `translate(${x}, ${y})`);
                        
                        // Note: For Col 2, w2=105.8 and h2=71.19
                        // L-Shape 1 (rotated coordinates)
                        const path1 = document.createElementNS("http://www.w3.org/2000/svg", "path");
                        path1.setAttribute("d", `M 0,0 L ${w2},0 L ${w2},${h2/2} L ${w2/2},${h2/2} L ${w2/2},${h2} L 0,${h2} Z`);
                        path1.setAttribute("fill", "#00b894");
                        path1.setAttribute("stroke", "#1d1d1f");
                        path1.setAttribute("stroke-width", "0.5");
                        
                        // L-Shape 2 (rotated coordinates)
                        const path2 = document.createElementNS("http://www.w3.org/2000/svg", "path");
                        path2.setAttribute("d", `M ${w2},${h2} L 0,${h2} L 0,${h2/2} L ${w2/2},${h2/2} L ${w2/2},0 L ${w2},0 Z`);
                        path2.setAttribute("fill", "#55efc4");
                        path2.setAttribute("stroke", "#1d1d1f");
                        path2.setAttribute("stroke-width", "0.5");
                        
                        group.appendChild(path1);
                        group.appendChild(path2);
                        svgContainer.appendChild(group);
                    }
                </script>
            </g>
        </svg>
    </div>

</body>
</html>
