<!DOCTYPE html>
<html>
<head>
    <title>Panel Layout Comparison</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        h1 {
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #86868b;
            margin-bottom: 40px;
        }
        .comparison-container {
            display: flex;
            gap: 60px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .panel-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.05);
        }
        .panel-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .panel-stats {
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.5;
        }
        svg {
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>Panel Layout Comparison</h1>
    <p class="subtitle">200x280mm Panel | 10mm Border | 3mm Routing Gap</p>

    <div class="comparison-container">
        
        <!-- BASELINE PANEL -->
        <div class="panel-wrapper">
            <div class="panel-title">Baseline: 22 x 93 mm</div>
            <div class="panel-stats">
                <strong>14 Units</strong> (7 cols &times; 2 rows)<br>
                Area Yield: 51.1%<br>
                <span style="color: #ff3b30;">Wasted Vertical Space: 71mm</span>
            </div>
            
            <svg width="300" height="420" viewBox="0 0 200 280">
                <!-- Panel Base (FR4) -->
                <rect x="0" y="0" width="200" height="280" fill="#2d3436" />
                <!-- 10mm Border / Usable Area -->
                <rect x="10" y="10" width="180" height="260" fill="none" stroke="#ff9f43" stroke-width="1.5" stroke-dasharray="4,4" />
                <text x="100" y="27" fill="#ff9f43" font-size="6" text-anchor="middle" font-family="sans-serif">10mm Border</text>
                
                <!-- Draw Modules: 7 cols, 2 rows. 
                     Offset X = 10 + (180 - (7*22 + 6*3))/2 = 14
                     Offset Y = 10 + (260 - (2*93 + 1*3))/2 = 45.5
                -->
                <g id="baseline-modules">
                    <script>
                        const svgBase = document.getElementById('baseline-modules');
                        const startX1 = 14;
                        const startY1 = 45.5;
                        for(let r=0; r<2; r++) {
                            for(let c=0; c<7; c++) {
                                let rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                                rect.setAttribute("x", startX1 + c * (22 + 3));
                                rect.setAttribute("y", startY1 + r * (93 + 3));
                                rect.setAttribute("width", 22);
                                rect.setAttribute("height", 93);
                                rect.setAttribute("fill", "#0984e3");
                                rect.setAttribute("rx", 1);
                                svgBase.appendChild(rect);
                            }
                        }
                    </script>
                </g>
            </svg>
        </div>

        <!-- OPTIMIZED PANEL -->
        <div class="panel-wrapper">
            <div class="panel-title">Optimized: 23.3 x 88.5 mm</div>
            <div class="panel-stats">
                <strong>20 Units</strong> (2 cols &times; 10 rows, rotated)<br>
                Area Yield: 73.6%<br>
                <span style="color: #00b894;">Perfectly packs the 180x260mm usable area</span>
            </div>
            
            <svg width="300" height="420" viewBox="0 0 200 280">
                <!-- Panel Base (FR4) -->
                <rect x="0" y="0" width="200" height="280" fill="#2d3436" />
                <!-- 10mm Border / Usable Area -->
                <rect x="10" y="10" width="180" height="260" fill="none" stroke="#ff9f43" stroke-width="1.5" stroke-dasharray="4,4" />
                <text x="100" y="27" fill="#ff9f43" font-size="6" text-anchor="middle" font-family="sans-serif">10mm Border</text>
                
                <!-- Draw Modules: 2 cols, 10 rows. Modules are rotated (width=88.5, height=23.3).
                     Offset X = 10 + (180 - (2*88.5 + 1*3))/2 = 10
                     Offset Y = 10 + (260 - (10*23.3 + 9*3))/2 = 10
                -->
                <g id="opt-modules">
                    <script>
                        const svgOpt = document.getElementById('opt-modules');
                        const startX2 = 10;
                        const startY2 = 10;
                        for(let r=0; r<10; r++) {
                            for(let c=0; c<2; c++) {
                                let rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                                rect.setAttribute("x", startX2 + c * (88.5 + 3));
                                rect.setAttribute("y", startY2 + r * (23.3 + 3));
                                rect.setAttribute("width", 88.5);
                                rect.setAttribute("height", 23.3);
                                rect.setAttribute("fill", "#00b894");
                                rect.setAttribute("rx", 1);
                                svgOpt.appendChild(rect);
                            }
                        }
                    </script>
                </g>
            </svg>
        </div>

    </div>

</body>
</html>
